[project]
name = "cognition"
version = "0.1.0"
description = "GitHub repo analyzer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PERF", "C90", "ASYNC", "S", "BLE",
  "DTZ", "ARG", "T20", "ERA", "FIX", "PTH", "N", "RUF", "D",
]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

